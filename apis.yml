name: Hang Ten
description: Hang Ten Systems is an enterprise AI services company founded in 2026 and
  headquartered in Palo Alto, California. Led by co-founder and CEO Dr. Vishal Sikka
  (formerly CEO of Infosys and a member of SAP's executive board), the company helps
  large enterprises adopt AI to build, change, and run the software that runs their
  business at a fraction of the cost and time. Its AI-native delivery model combines
  agentic code generation, a reusable skills library, and deep domain expertise across
  SAP migrations, finance, HR, and new product development. Hang Ten raised a $32 million
  seed round led by Mayfield with strategic investment from Aramco Ventures, and counts
  Siemens Gamesa Renewable Energy and Fresenius among its early customers.
